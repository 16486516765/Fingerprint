name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;34.0.0"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Report build errors (temporary debug)
        if: failure()
        run: |
          gradle :app:compileDebugKotlin --no-daemon > /tmp/build.log 2>&1 || true
          ERRS=$(grep -E "^e: |error:|FAILED|Could not resolve|Could not find" /tmp/build.log | head -40)
          if [ -z "$ERRS" ]; then ERRS=$(tail -30 /tmp/build.log); fi
          gh issue create --title "build-${{ github.run_number }} 构建失败日志（调试用）" --body "$ERRS" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fingerprint-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fingerprint APK build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
